[project]
name = "link2note"
version = "0.1.0"
description = "Telegram bot: link -> AI digest -> Obsidian note"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.31,<4",
    "apscheduler>=3.10,<4",
    "google-genai",
    "yt-dlp[curl-cffi]",  # curl_cffi — impersonation, без него Instagram часто не отдаёт видео
    "trafilatura",
    "httpx",
    "jinja2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "faster-whisper>=1.1",
    # PyAV 19.0.0 убрал av.open(metadata_errors=...), а faster-whisper 1.2.1 его передаёт.
    # Снять ограничение, когда faster-whisper выпустит совместимую версию.
    "av>=11,<19",
    "imageio-ffmpeg>=0.8.1 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyyaml>=6.0.3",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
