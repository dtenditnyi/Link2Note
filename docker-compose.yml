# Link2Note на домашнем сервере рядом с Second Brain. Пошагово — docs/DEPLOY.md.
# Первый запуск — deploy/install.sh (папки с владельцем 1000:1000, сеть, systemd, проверка .env).
#
# Переменные compose (берутся из окружения или .env рядом с этим файлом):
#   DOCKER_NETWORK          — общая внешняя сеть с сайтом (по умолчанию secondbrain)
#   SECOND_BRAIN_CONTAINER  — имя контейнера сайта в этой сети (по умолчанию secondbrain-web)
#   LINK2NOTE_CONTAINER     — имя контейнера бота (по умолчанию link2note)
# Бот ходит в API напрямую по внутренней сети: http://<SECOND_BRAIN_CONTAINER>:8000/api/v1.
#
# VAULT_BACKEND=git: ./vault — git clone хранилища, ./secrets — deploy key (ключ на хосте:
#   chown 1000:1000 secrets/deploy_key && chmod 600 secrets/deploy_key). В .env:
#   VAULT_REPO=/vault
#   GIT_SSH_COMMAND=ssh -i /secrets/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new
# Instagram (необязательно): COOKIES_FILE=/secrets/instagram_cookies.txt (бот берёт копию).
services:
  bot:
    build: .
    image: link2note:latest
    container_name: ${LINK2NOTE_CONTAINER:-link2note}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Bucharest}
      SECOND_BRAIN_API_URL: ${SECOND_BRAIN_API_URL:-http://${SECOND_BRAIN_CONTAINER:-secondbrain-web}:8000/api/v1}
    volumes:
      - ./data:/app/data                                   # SQLite, heartbeat
      - whisper_cache:/home/botuser/.cache/huggingface      # модель Whisper скачивается один раз
      - ./vault:/vault                                     # клон хранилища (только VAULT_BACKEND=git)
      - ./secrets:/secrets:ro                              # deploy key, cookies — только чтение
    networks:
      - default
      - secondbrain
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  secondbrain:
    name: ${DOCKER_NETWORK:-secondbrain}
    external: true

volumes:
  whisper_cache:
